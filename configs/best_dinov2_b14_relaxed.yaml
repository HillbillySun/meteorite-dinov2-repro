model:
  name: dinov2_vitb14_reg
  loader: torchhub
  feature_pool: cls_patch_mean
  image_size: 392
  resize_size: 420

data:
  val_ids_csv: data/splits/hardval_ablation/val_mild_400g.csv
  raw_zero_root: data/zero_raw_v1/stage2_style_v3_relaxed_dino_root

path_a_fixed_cache:
  description: Fast exact reproduction using the packaged DINOv2 feature cache.
  script: scripts/reproduce_best.sh
  feature_cache: artifacts/features_cache_dinov2_b14_relaxed_mild.pt
  output: runs/reproduce_dinov2_b14_best_exact/runs/s3407_pw1p00_mx0p03_do0p45_ls0p02_lr0p0005_wd0p01/topk_90.csv
  training:
    seed: 3407
    positive_class_weight: 1.00
    feature_mixup_alpha: 0.03
    dropout: 0.45
    label_smoothing: 0.02
    lr: 0.0005
    weight_decay: 0.01
    epochs: 60
    patience: 10
    early_stop_metric: topk_f1

path_b_grid_rank1:
  description: Original-style grid search; select rank1 by validation topk_f1.
  script: scripts/grid_search_original_like_topkf1.sh
  output: runs/grid_original_like_topkf1_zero_raw_v1/runs/s3407_pw1p00_mx0p05_do0p45_ls0p03_lr0p0005_wd0p01/topk_90.csv
  rank1:
    seed: 3407
    positive_class_weight: 1.00
    feature_mixup_alpha: 0.05
    dropout: 0.45
    label_smoothing: 0.03
    lr: 0.0005
    weight_decay: 0.01
    best_epoch: 56
    val_topk_f1: 0.9303201506591338
  grid:
    head_seeds: [3407, 42, 2024]
    positive_class_weights: [1.00, 1.05]
    feature_mixup_alphas: [0.00, 0.05, 0.10, 0.20]
    dropouts: [0.35, 0.45, 0.55]
    label_smoothings: [0.00, 0.03, 0.05]
    lrs: [0.0005, 0.001]
    weight_decays: [0.01]
    epochs: 70
    patience: 10
    early_stop_metric: topk_f1
    test_hflip_tta: true

submission:
  best_topk: 90
  public_score: 0.79545
  best_file: outputs/best_submission/topk_90.csv
